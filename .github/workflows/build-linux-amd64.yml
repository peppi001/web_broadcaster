name: Build Web Broadcaster (Linux amd64)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/github-actions-build

permissions:
  contents: read

concurrency:
  group: web-broadcaster-amd64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vendor-dependencies:
    name: Commit pinned FFmpeg and SoundSolution build inputs to the development branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      head_sha: ${{ steps.vendor.outputs.head_sha }}
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: feature/github-actions-build
          fetch-depth: 1

      - name: Import pinned buildkit into Git once, if absent
        id: vendor
        shell: bash
        run: |
          set -Eeuo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ ! -f buildkit/build_v6085_linux.sh ]]; then
            archive="$(mktemp --suffix=.zip)"
            tmp="$(mktemp -d)"
            trap 'rm -rf "$archive" "$tmp"' EXIT
            echo "Importing validated v6085 toolchain once into Git..."
            curl --fail --location --show-error --silent --retry 4 \
              --output "$archive" \
              "https://github.com/peppi001/web_broadcaster/releases/download/v6085/Web_Broadcaster_v6085_buildkit.zip"
            echo "f056e2828bc327f68e39d64a311a26ed51de636b7eb0cc959f83eed9fecbe404  $archive" | sha256sum --check
            unzip -q "$archive" -d "$tmp"
            old="$tmp/Web_Broadcaster_v6085_buildkit"
            (
              cd "$old"
              sha256sum --check --status SHA256SUMS.txt
            )
            mkdir -p buildkit
            cp -a "$old/." buildkit/
            # Source is always taken from Git, not this historical release ZIP.
            rm -f buildkit/Web_Broadcaster_v6085.zip
            git add -f buildkit/
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Build: vendor versioned FFmpeg and SoundSolution assets and the validated Linux builder"
            git push origin HEAD:refs/heads/feature/github-actions-build
          fi
          test -f buildkit/build_v6085_linux.sh
          test -f buildkit/ffmpeg_build/wb-ffmpeg-7.1.5-amd64-runtime.tar.gz
          test -f buildkit/ffmpeg_build/wb-ffmpeg-7.1.5-arm64-rpi5-runtime.tar.gz
          test -f buildkit/soundsolution_build/wb-soundsolution-6.1.0-amd64-runtime.tar.gz
          test -f buildkit/soundsolution_build/wb-soundsolution-6.0.0-arm64-rpi5-runtime.tar.gz
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: vendor-dependencies
    permissions:
      contents: read
    name: Build full Debian 12 compatible amd64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:12-slim
      # Reap orphaned child processes after forced parent termination in daemon tests.
      options: --init

    steps:
      - name: Install Debian 12 build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            bash build-essential binutils ca-certificates coreutils curl \
            ffmpeg file findutils gawk git grep libpython3.11 make nodejs \
            python3 python3-venv sed tar unzip
          rm -rf /var/lib/apt/lists/*

      - name: Checkout the exact vendored Git commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.vendor-dependencies.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare pinned build dependencies with current Git sources
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Compiling checked-out Git commit: $GITHUB_SHA"
          bash .github/scripts/prepare-amd64-build.sh
          # Fixture generation requires lavfi, deliberately excluded from the
          # buildkit's custom Web Broadcaster FFmpeg runtime.
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=0.01" -f null -

      - name: Build and test complete Linux amd64 package
        shell: bash
        env:
          WB_DEBIAN12_CONTAINER: "1"
          RUN_SOURCE_TESTS: "1"
        run: |
          set -Eeuo pipefail
          bash "$BUILDKIT_DIR/build_v6085_linux.sh"

      - name: Verify completed release archive and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$BUILDKIT_DIR"
          package="Web_Broadcaster_Linux_v${APP_VERSION}_amd64.tar.gz"
          test -s "$package"
          test -s "$package.sha256"
          sha256sum --check "$package.sha256"
          tar -tzf "$package" > package-members.txt
          base="Web_Broadcaster_Linux_v${APP_VERSION}"
          for path in \
            "$base/start.sh" \
            "$base/README.txt" \
            "$base/bin/web_broadcaster" \
            "$base/bin/web_broadcaster_engine" \
            "$base/bin/libsoundsolution.so.2" \
            "$base/bin/libavformat.so.61" \
            "$base/bin/ss18.dat" \
            "$base/html/broadcaster.html" \
            "$base/docs/DEPLOYMENT_GUIDE.md"; do
            grep -Fxq "$path" package-members.txt || {
              echo "Missing final package member: $path" >&2
              exit 1
            }
          done
          echo "Verified complete Web Broadcaster v${APP_VERSION} amd64 package."

      - name: Upload deployable package
        uses: actions/upload-artifact@v4
        with:
          name: Web_Broadcaster_Linux_v${{ env.APP_VERSION }}_amd64
          path: |
            ${{ env.BUILDKIT_DIR }}/Web_Broadcaster_Linux_v${{ env.APP_VERSION }}_amd64.tar.gz
            ${{ env.BUILDKIT_DIR }}/Web_Broadcaster_Linux_v${{ env.APP_VERSION }}_amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload regression log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-broadcaster-amd64-regression-log
          path: .ci-build/Web_Broadcaster_v6085_buildkit/build_work/source-regression.log
          if-no-files-found: ignore
          retention-days: 14
